port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 50000
  port_range_start: 50000
  port_range_end: 50010
  use_external_ip: false
keys:
  devkey: devsecret
development: true
log_level: debug
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3001/api/livekit/webhook
# Redis configuration for egress service
redis:
  address: host.docker.internal:6379

