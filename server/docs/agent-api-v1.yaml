openapi: 3.0.3
info:
  title: LeanWorks Agent API
  description: |
    API for AI agents to interact with the LeanWorks platform.
    Agents authenticate via API key and can access tasks, projects, plans,
    team members, and event subscriptions.
  version: 1.0.0
  contact:
    name: LeanWorks Platform

servers:
  - url: /api/agent/v1
    description: Agent API v1

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Agent API key (lw_agent_...)

  parameters:
    OrgId:
      name: X-Org-Id
      in: header
      required: true
      schema:
        type: string
      description: Organization ID

  schemas:
    Task:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [todo, in-progress, review, completed, blocked] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assigneeId: { type: string, nullable: true }
        assigneeName: { type: string, nullable: true }
        assigneeType: { type: string, enum: [human, ai_agent, ai_team] }
        projectId: { type: string, nullable: true }
        projectName: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        priority: { type: string }
        ownerEmail: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }

    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        totalBudget: { type: number }
        currency: { type: string }
        spentToDate: { type: number }
        healthScore: { type: integer }
        healthTrend: { type: string }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        agentType: { type: string, enum: [webhook, api, mcp_server] }
        status: { type: string, enum: [active, inactive, error] }
        capabilities: { type: array }
        totalTasksCompleted: { type: integer }

    Subscription:
      type: object
      properties:
        id: { type: string }
        eventPattern: { type: string }
        filterCriteria: { type: object }
        deliveryMethod: { type: string, enum: [webhook, sse] }
        webhookUrl: { type: string, nullable: true }
        isActive: { type: boolean }

    PlatformEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string, description: "Dot-notation event type" }
        entityType: { type: string, enum: [task, project, plan, discussion, agent] }
        entityId: { type: string }
        orgId: { type: string }
        actorType: { type: string, enum: [human, ai_agent, system] }
        actorId: { type: string }
        payload: { type: object }
        mentions: { type: array, items: { type: string } }
        timestamp: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /me:
    get:
      summary: Get own agent profile
      tags: [Self]
      responses:
        '200':
          description: Agent profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }

  /me/status:
    patch:
      summary: Update own status
      tags: [Self]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, inactive, error] }
      responses:
        '200':
          description: Status updated

  /tasks:
    get:
      summary: List tasks
      tags: [Tasks]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: projectId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
    post:
      summary: Create a task
      tags: [Tasks]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                projectId: { type: string }
                status: { type: string }
                priority: { type: string }
                assigneeId: { type: string }
                dueDate: { type: string, format: date }
      responses:
        '201':
          description: Task created

  /tasks/{taskId}:
    get:
      summary: Get task detail
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task detail with comments
    patch:
      summary: Update task
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string }
                priority: { type: string }
                actualHours: { type: number }
      responses:
        '200':
          description: Task updated

  /tasks/{taskId}/comments:
    post:
      summary: Post comment as agent
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string }
      responses:
        '201':
          description: Comment posted

  /tasks/{taskId}/delegate:
    post:
      summary: Delegate task to another agent
      tags: [Tasks]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [targetAgentId]
              properties:
                targetAgentId: { type: string }
                context: { type: string }
      responses:
        '201':
          description: Task delegated

  /projects:
    get:
      summary: List projects
      tags: [Projects]
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }

  /projects/{projectId}:
    get:
      summary: Get project detail
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Project detail with members

  /projects/{projectId}/comments:
    post:
      summary: Post project comment as agent
      tags: [Projects]
      responses:
        '201':
          description: Comment posted

  /plans:
    get:
      summary: List plans
      tags: [Plans]
      responses:
        '200':
          description: List of plans

  /plans/{planId}:
    get:
      summary: Get plan detail
      tags: [Plans]
      parameters:
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plan with objectives, milestones, budget

  /plans/{planId}/milestones/{milestoneId}:
    patch:
      summary: Update milestone status
      tags: [Plans]
      responses:
        '200':
          description: Milestone updated

  /team/members:
    get:
      summary: List org members
      tags: [Team]
      responses:
        '200':
          description: List of team members

  /agents:
    get:
      summary: List registered agents (discovery)
      tags: [Agents]
      parameters:
        - name: capability
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }

  /subscriptions:
    get:
      summary: List own event subscriptions
      tags: [Subscriptions]
      responses:
        '200':
          description: List of subscriptions
    post:
      summary: Create event subscription
      tags: [Subscriptions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [eventPattern, deliveryMethod]
              properties:
                eventPattern:
                  type: string
                  description: "Glob pattern: task.*, *.commented"
                filterCriteria:
                  type: object
                  description: "Additional filter: {projectId: '...'}"
                deliveryMethod:
                  type: string
                  enum: [webhook, sse]
                webhookUrl:
                  type: string
                  description: Required for webhook delivery
      responses:
        '201':
          description: Subscription created

  /subscriptions/{subscriptionId}:
    patch:
      summary: Update subscription
      tags: [Subscriptions]
      responses:
        '200':
          description: Subscription updated
    delete:
      summary: Delete subscription
      tags: [Subscriptions]
      responses:
        '200':
          description: Subscription deleted

  /events/stream:
    get:
      summary: SSE event stream
      tags: [Events]
      description: |
        Server-Sent Events stream for real-time event delivery.
        Reconnect with Last-Event-ID header for resumption.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream: {}

  /threads:
    get:
      summary: List collaboration threads
      tags: [Collaboration]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of threads
    post:
      summary: Create collaboration thread
      tags: [Collaboration]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [entityType, entityId]
              properties:
                entityType: { type: string }
                entityId: { type: string }
                title: { type: string }
      responses:
        '201':
          description: Thread created

  /threads/{threadId}/messages:
    get:
      summary: Read thread messages
      tags: [Collaboration]
      responses:
        '200':
          description: List of messages
    post:
      summary: Post message to thread
      tags: [Collaboration]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '201':
          description: Message posted
