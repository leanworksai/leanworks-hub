apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  labels:
    app: cloud-sql-proxy
spec:
  replicas: 2  # For high availability
  selector:
    matchLabels:
      app: cloud-sql-proxy
  template:
    metadata:
      labels:
        app: cloud-sql-proxy
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      tolerations:
      - key: "node.gke.io/balloon-pod-resize"
        operator: "Exists"
        effect: "NoSchedule"
      serviceAccountName: leanworks-hub-sa
      containers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
        - "--address=0.0.0.0"
        - "--port=5432"
        - "--credentials-file=/secrets/gcp_credential.json"
        - "$(DB_INSTANCE_CONNECTION_STRING)"
        env:
        - name: DB_INSTANCE_CONNECTION_STRING
          valueFrom:
            configMapKeyRef:
              name: leanworks-config
              key: DB_INSTANCE_CONNECTION_STRING
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: gcp-credentials
          mountPath: /secrets
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
      volumes:
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-sql-proxy-service
  labels:
    app: cloud-sql-proxy
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: cloud-sql-proxy
