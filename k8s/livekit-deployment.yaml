apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
  labels:
    app: livekit-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-server
  template:
    metadata:
      labels:
        app: livekit-server
    spec:
      serviceAccountName: leanworks-hub-sa  # Use same service account with Secret Manager access
      containers:
      - name: livekit-server
        image: livekit/livekit-server:latest
        imagePullPolicy: Always
        command: ['sh', '-c']
        args:
        - |
          echo "Checking config file..."
          ls -la /etc/livekit/ || echo "Directory doesn't exist"
          cat /etc/livekit/livekit.yaml || echo "Config file doesn't exist"
          echo "Starting LiveKit server..."
          exec /livekit-server --config /etc/livekit/livekit.yaml
        ports:
        - containerPort: 7880
          name: http
        - containerPort: 7881
          name: https
        - containerPort: 50000
          name: rtc-udp
          protocol: UDP
        - containerPort: 50000
          name: rtc-tcp
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit
      # Use an init container to fetch secrets from GCP Secret Manager and generate config
      initContainers:
      - name: secret-fetcher
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:latest
        command: ['sh', '-c']
        args:
        - |
          set -e
          echo "📥 Fetching LiveKit credentials from GCP Secret Manager..."
          
          # Fetch API Key from Secret Manager
          API_KEY=$(gcloud secrets versions access latest --secret=livekit-api-key --project=leanworks-474204)
          if [ -z "$API_KEY" ]; then
            echo "❌ Error: Failed to fetch livekit-api-key"
            exit 1
          fi
          echo "✅ API key fetched (length: ${#API_KEY})"
          
          # Fetch API Secret from Secret Manager
          API_SECRET=$(gcloud secrets versions access latest --secret=livekit-api-secret --project=leanworks-474204)
          if [ -z "$API_SECRET" ]; then
            echo "❌ Error: Failed to fetch livekit-api-secret"
            exit 1
          fi
          echo "✅ API secret fetched (length: ${#API_SECRET})"
          
          # Generate LiveKit config file
          mkdir -p /etc/livekit
          # Get webhook URL from environment or use default
          WEBHOOK_URL=\${WEBHOOK_URL:-https://api.leanworks.ai/api/livekit/webhook}
          
          cat > /etc/livekit/livekit.yaml <<EOF
          port: 7880
          bind_addresses:
            - "0.0.0.0"
          rtc:
            tcp_port: 50000
            port_range_start: 50000
            port_range_end: 60000
            use_external_ip: true
          keys:
            ${API_KEY}: ${API_SECRET}
          development: false
          log_level: info
          webhook:
            api_key: ${API_KEY}
            urls:
              - ${WEBHOOK_URL}
          EOF
          
          echo "✅ LiveKit config generated at /etc/livekit/livekit.yaml"
          cat /etc/livekit/livekit.yaml | sed 's/: .*$/: ***/'  # Show config with secrets masked
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit
        # Mount GCP credentials for Secret Manager access
        - name: gcp-credentials
          mountPath: /secrets/gcp_credential.json
          subPath: gcp_credential.json
          readOnly: true
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /secrets/gcp_credential.json
      volumes:
      - name: livekit-config
        emptyDir: {}
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials

---
# TCP Service for HTTP/WebSocket (signaling)
apiVersion: v1
kind: Service
metadata:
  name: livekit-service
  labels:
    app: livekit-server
spec:
  type: LoadBalancer
  ports:
  - port: 7880
    targetPort: 7880
    protocol: TCP
    name: http
  - port: 7881
    targetPort: 7881
    protocol: TCP
    name: https
  selector:
    app: livekit-server
  sessionAffinity: ClientIP

---
# UDP Service for RTC media (WebRTC)
apiVersion: v1
kind: Service
metadata:
  name: livekit-service-udp
  labels:
    app: livekit-server
spec:
  type: LoadBalancer
  ports:
  - port: 50000
    targetPort: 50000
    protocol: UDP
    name: rtc-udp
  selector:
    app: livekit-server
  sessionAffinity: ClientIP

---
# TCP Service for RTC media (fallback)
apiVersion: v1
kind: Service
metadata:
  name: livekit-service-rtc-tcp
  labels:
    app: livekit-server
spec:
  type: LoadBalancer
  ports:
  - port: 50000
    targetPort: 50000
    protocol: TCP
    name: rtc-tcp
  selector:
    app: livekit-server
  sessionAffinity: ClientIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  config.yaml: |
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    rtc:
      tcp_port: 50000
      port_range_start: 50000
      port_range_end: 60000
      use_external_ip: true
    # Keys will be provided via environment variables (LIVEKIT_KEY and LIVEKIT_SECRET)
    # The keys section can be empty if using env vars
    keys: {}
    development: false
    log_level: info

---
# Note: LiveKit credentials are now fetched directly from GCP Secret Manager
# via the init container. No Kubernetes Secret is needed.
# The secrets are stored in GCP Secret Manager:
#   - livekit-api-key
#   - livekit-api-secret

