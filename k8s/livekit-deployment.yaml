apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
  labels:
    app: livekit-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-server
  template:
    metadata:
      labels:
        app: livekit-server
    spec:
      containers:
      - name: livekit-server
        image: livekit/livekit-server:latest
        imagePullPolicy: Always
        command: ['sh', '-c']
        args:
        - |
          echo "Checking config file..."
          ls -la /etc/livekit/ || echo "Directory doesn't exist"
          cat /etc/livekit/livekit.yaml || echo "Config file doesn't exist"
          echo "Starting LiveKit server..."
          exec /livekit-server --config /etc/livekit/livekit.yaml
        ports:
        - containerPort: 7880
          name: http
        - containerPort: 7881
          name: https
        - containerPort: 50000
          name: rtc-udp
          protocol: UDP
        - containerPort: 50000
          name: rtc-tcp
          protocol: TCP
        env:
        # LiveKit API credentials (from Secret Manager via Kubernetes Secret)
        # LiveKit uses LIVEKIT_KEY and LIVEKIT_SECRET as separate environment variables
        - name: LIVEKIT_KEY
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-key
        - name: LIVEKIT_SECRET
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: api-secret
        - name: LIVEKIT_REDIS
          valueFrom:
            secretKeyRef:
              name: livekit-secrets
              key: redis-url
              optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit
      # Use an init container to generate config with keys from secrets
      initContainers:
      - name: config-generator
        image: busybox:latest
        command: ['sh', '-c']
        args:
        - |
          API_KEY=$(cat /secrets/api-key)
          API_SECRET=$(cat /secrets/api-secret)
          mkdir -p /etc/livekit
          cat > /etc/livekit/livekit.yaml <<EOF
          port: 7880
          bind_addresses:
            - "0.0.0.0"
          rtc:
            tcp_port: 50000
            port_range_start: 50000
            port_range_end: 60000
            use_external_ip: true
          keys:
            ${API_KEY}: ${API_SECRET}
          development: false
          log_level: info
          EOF
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit
        - name: livekit-secrets-volume
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: livekit-config
        emptyDir: {}
      - name: livekit-secrets-volume
        secret:
          secretName: livekit-secrets

---
# TCP Service for HTTP/WebSocket (signaling)
apiVersion: v1
kind: Service
metadata:
  name: livekit-service
  labels:
    app: livekit-server
spec:
  type: LoadBalancer
  ports:
  - port: 7880
    targetPort: 7880
    protocol: TCP
    name: http
  - port: 7881
    targetPort: 7881
    protocol: TCP
    name: https
  selector:
    app: livekit-server
  sessionAffinity: ClientIP

---
# UDP Service for RTC media (WebRTC)
apiVersion: v1
kind: Service
metadata:
  name: livekit-service-udp
  labels:
    app: livekit-server
spec:
  type: LoadBalancer
  ports:
  - port: 50000
    targetPort: 50000
    protocol: UDP
    name: rtc-udp
  selector:
    app: livekit-server
  sessionAffinity: ClientIP

---
# TCP Service for RTC media (fallback)
apiVersion: v1
kind: Service
metadata:
  name: livekit-service-rtc-tcp
  labels:
    app: livekit-server
spec:
  type: LoadBalancer
  ports:
  - port: 50000
    targetPort: 50000
    protocol: TCP
    name: rtc-tcp
  selector:
    app: livekit-server
  sessionAffinity: ClientIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  config.yaml: |
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    rtc:
      tcp_port: 50000
      port_range_start: 50000
      port_range_end: 60000
      use_external_ip: true
    # Keys will be provided via environment variables (LIVEKIT_KEY and LIVEKIT_SECRET)
    # The keys section can be empty if using env vars
    keys: {}
    development: false
    log_level: info

---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-secrets
type: Opaque
stringData:
  api-key: "devkey"  # Replace with actual key from Secret Manager
  api-secret: "secret"  # Replace with actual secret from Secret Manager
  redis-url: ""  # Optional: Redis connection string if using Redis

