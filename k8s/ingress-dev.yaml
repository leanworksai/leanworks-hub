apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leanworks-hub-ingress-dev
  labels:
    app: leanworks-hub
    environment: dev
  annotations:
    # Static IP for dev environment
    kubernetes.io/ingress.global-static-ip-name: "leanworks-dev-hub-ip"
    # SSL certificate for HTTPS
    networking.gke.io/managed-certificates: "dev-leanworks-ai-ssl-cert"
    # HTTPS only
    kubernetes.io/ingress.allow-http: "false"
    # Backend config annotation
    kubernetes.io/ingress.backend-config: '{"default": "leanworks-hub-backend-config"}'
    # Ingress class annotation
    kubernetes.io/ingress.class: "gce"
spec:
  ingressClassName: gce
  rules:
  # Dev main domain
  - host: dev.leanworks.ai
    http:
      paths:
      # Leanworks-app API endpoints (must come before catch-all)
      - path: /api/ask
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      - path: /api/generate-task
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      - path: /api/verify
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      - path: /api/cache/clear
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      - path: /api/messages/generate-response
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      - path: /api/doc-summary
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      # Legacy /ask path for backward compatibility
      - path: /ask
        pathType: Exact
        backend:
          service:
            name: ask-api
            port:
              number: 80
      # All other paths go to main app
      - path: /
        pathType: Prefix
        backend:
          service:
            name: leanworks-hub-service
            port:
              number: 80

---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: dev-leanworks-ai-ssl-cert
spec:
  domains:
    - dev.leanworks.ai
