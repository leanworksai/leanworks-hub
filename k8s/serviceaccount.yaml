apiVersion: v1
kind: ServiceAccount
metadata:
  name: leanworks-hub-sa
  namespace: default
  annotations:
    # This annotation will be set by the deployment script
    # It links the KSA to the GSA for Workload Identity
    # Format: iam.gke.io/gcp-service-account=GSA_NAME@PROJECT_ID.iam.gserviceaccount.com
    # Example: iam.gke.io/gcp-service-account=leanworks-hub-gsa@leanworks-474204.iam.gserviceaccount.com
    # Note: The deploy.sh script will set this automatically
    #
    # Required IAM roles for the GSA (Google Service Account):
    # - roles/cloudsql.client (for database access)
    #
    # To grant these roles, run:
    # gcloud projects add-iam-policy-binding leanworks-474204 \
    #   --member="serviceAccount:deployment@leanworks-474204.iam.gserviceaccount.com" \
    #   --role="roles/pubsub.publisher"
    # gcloud projects add-iam-policy-binding leanworks-474204 \
    #   --member="serviceAccount:deployment@leanworks-474204.iam.gserviceaccount.com" \
    #   --role="roles/pubsub.subscriber"
    # gcloud projects add-iam-policy-binding leanworks-474204 \
    #   --member="serviceAccount:deployment@leanworks-474204.iam.gserviceaccount.com" \
    #   --role="roles/storage.objectCreator"

