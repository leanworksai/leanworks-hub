apiVersion: apps/v1
kind: Deployment
metadata:
  name: leanworks-hub
  labels:
    app: leanworks-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leanworks-hub
  template:
    metadata:
      labels:
        app: leanworks-hub
    spec:
      containers:
      - name: leanworks-hub
        image: us-west1-docker.pkg.dev/leanworks-474204/docker-repo/leanworks-hub:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"  # Increased for image uploads (10MB files in memory)
            cpu: "200m"
        # Mount GCP credentials for Secret Manager access
        volumeMounts:
        - name: gcp-credentials
          mountPath: /app/gcp_credential.json
          subPath: gcp_credential.json
          readOnly: true
        env:
        - name: DB_HOST
          value: cloud-sql-proxy-service  # Kubernetes service DNS name
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_REGION
          value: "us-west1"
        - name: LIVEKIT_URL
          # After deploying LiveKit, get the LoadBalancer IP with:
          # kubectl get svc livekit-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
          # Then update this value to: wss://<ip>:7880 or wss://livekit.leanworks.ai (if using domain)
          # For development, you can use the internal service URL:
          value: "ws://livekit-service.default.svc.cluster.local:7880"
          # For production, replace with LoadBalancer external IP or domain:
          # value: "wss://<loadbalancer-ip>:7880"
          # Or with domain and SSL:
          # value: "wss://livekit.leanworks.ai"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: leanworks-hub-service
  labels:
    app: leanworks-hub
  annotations:
    cloud.google.com/backend-config: '{"default": "leanworks-hub-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: leanworks-hub

