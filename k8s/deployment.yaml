apiVersion: apps/v1
kind: Deployment
metadata:
  name: leanworks-hub
  labels:
    app: leanworks-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leanworks-hub
  template:
    metadata:
      labels:
        app: leanworks-hub
    spec:
      containers:
      - name: leanworks-hub
        image: us-west1-docker.pkg.dev/leanworks-474204/docker-repo/leanworks-hub:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        # Mount the Cloud SQL Unix socket and GCP credentials
        volumeMounts:
        - name: cloudsql
          mountPath: /cloudsql
        - name: gcp-credentials
          mountPath: /app/gcp_credential.json
          subPath: gcp_credential.json
          readOnly: true
        env:
        - name: DB_HOST
          value: /cloudsql/leanworks-474204:us-west1:leanworks-prod
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_REGION
          value: "us-west1"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      # Cloud SQL Proxy sidecar container
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
        - "--unix-socket=/cloudsql"
        - "--credentials-file=/secrets/gcp_credential.json"
        - "leanworks-474204:us-west1:leanworks-prod"
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: cloudsql
          mountPath: /cloudsql
        - name: gcp-credentials
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: cloudsql
        emptyDir: {}
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: leanworks-hub-service
  labels:
    app: leanworks-hub
  annotations:
    cloud.google.com/backend-config: '{"default": "leanworks-hub-backend-config"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: leanworks-hub

