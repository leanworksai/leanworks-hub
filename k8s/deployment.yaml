apiVersion: apps/v1
kind: Deployment
metadata:
  name: leanworks-hub
  labels:
    app: leanworks-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leanworks-hub
  template:
    metadata:
      labels:
        app: leanworks-hub
    spec:
      containers:
      - name: leanworks-hub
        image: gcr.io/leanworks/leanworks-hub:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: leanworks-hub-service
  labels:
    app: leanworks-hub
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: leanworks-hub

