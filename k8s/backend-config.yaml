apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: leanworks-hub-backend-config
  namespace: default
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 10
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /
    port: 80
  timeoutSec: 120  # Increased for image uploads (10MB can take time)
  connectionDraining:
    drainingTimeoutSec: 60
  # Note: GKE Ingress automatically handles WebSocket upgrades
  # No additional configuration needed for WebSocket support

