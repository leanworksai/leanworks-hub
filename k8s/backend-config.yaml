apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: leanworks-hub-backend-config
  namespace: default
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 10
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /
    port: 80
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60

